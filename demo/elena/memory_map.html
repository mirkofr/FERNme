      const a=-Math.PI/2+i*2*Math.PI/total, ring=Math.min(W,H)*0.34;
      x=W/2+Math.cos(a)*ring; y=H/2+Math.sin(a)*ring; fx=x; fy=y;
    }else if((x==null||y==null)&&n.parent&&(parent||seed)){
      const sib=siblings[n.parent]||[], i=Math.max(0,sib.indexOf(n.id)), total=Math.max(1,sib.length);
      const a=-Math.PI/2+i*2*Math.PI/total, ring=70+Math.min(120,total*2.2);
      const cx=(parent&&parent.x)||(seed&&seed.x)||W/2, cy=(parent&&parent.y)||(seed&&seed.y)||H/2;
      x=cx+Math.cos(a)*ring; y=cy+Math.sin(a)*ring;
    }
    if(x==null||y==null){x=n.kind==="owner"?W/2:W/2+(Math.random()-.5)*360;y=n.kind==="owner"?H/2:H/2+(Math.random()-.5)*300;}
    return {...n,r:nodeRadius(n),x,y,fx,fy};
  })];
  byId={}; nodes.forEach(n=>byId[n.id]=n);
  links=sourceEdges.filter(e=>keep.has(e.source)&&keep.has(e.target))
                   .map(e=>({source:e.source,target:e.target,weight:e.weight,aggregated:e.aggregated,cross:e.cross,
                             entity_relation:e.entity_relation,relation:e.relation||e.label,confidence:e.confidence,
                             subject_id:e.subject_id,object_id:e.object_id,facts:e.facts||[],
                             fact_count:e.fact_count||0,note:e.note||"",provenance:e.provenance||"",
                             hits:e.hits||0,known:e.known}));
  // owner links to the strongest node per category so it sits central + connected
  const strongest={};
  ns.forEach(n=>{ if(!strongest[n.cat]||n.size>strongest[n.cat].size) strongest[n.cat]=n; });
  if(!focusAnchor)Object.values(strongest).forEach(n=>links.push({source:"__owner__",target:n.id,weight:3,owner:true}));
  assignRelationSlots(links);
  adj={}; links.forEach(l=>{const s=l.source.id||l.source,t=l.target.id||l.target;(adj[s]=adj[s]||new Set()).add(t);(adj[t]=adj[t]||new Set()).add(s);});
}

// ---- category anchor positions (ring) for clustering force ----
let catPos={};
function layoutAnchors(){
  const ks=DATA.cats.map(c=>c.key), R=Math.min(W,H)*0.30;
  ks.forEach((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/ks.length;catPos[k]={x:W/2+Math.cos(a)*R,y:H/2+Math.sin(a)*R};});
}

let sim;
function start(){
  build();
  sim=d3.forceSimulation(nodes)
    .force("charge",d3.forceManyBody().strength(d=>d.owner?-200:-55))
    .force("link",d3.forceLink(links).id(d=>d.id).distance(d=>d.owner?70:42).strength(d=>d.owner?0.06:0.18))
    .force("collide",d3.forceCollide().radius(d=>d.r+(d.entity_id?18+Math.min(8,entityInfoCount(d)):(d.id==="__unclustered__"?12:2.5))).strength(.9))
    .force("x",d3.forceX(d=>d.owner?W/2:(catPos[d.cat]?catPos[d.cat].x:W/2)).strength(d=>d.owner?0.2:0.09))
    .force("y",d3.forceY(d=>d.owner?H/2:(catPos[d.cat]?catPos[d.cat].y:H/2)).strength(d=>d.owner?0.2:0.09))
    .on("tick",paint);
  sim.alpha(1).restart();
}

function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layoutAnchors();}
function T(x,y){return [x*view.k+view.x, y*view.k+view.y];}
function nb(n){return n&&hover&&(n===hover||(adj[hover.id]&&adj[hover.id].has(n.id)));}
function nbSel(n){return n&&selected&&(n===selected||(adj[selected.id]&&adj[selected.id].has(n.id)));}
function relationLabelPoint(x1,y1,x2,y2,l){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len,slot=l.relationSlot||0,count=l.relationCount||1;
  const side=count>1&&slot<0?-1:1,offset=(count>1?22:14)+Math.abs(slot)*24;
  return {x:(x1+x2)/2+nx*side*offset,y:(y1+y2)/2+ny*side*offset};
}
function relationLabelWidth(l){
  return ctx.measureText(l.text).width+10+(l.fact_count>1?26:0);
}
function drawRelationLabel(l){
  const text=l.text,x=l.x,y=l.y,dim=l.dim;
  const labelW=ctx.measureText(text).width+10;
  const w=relationLabelWidth(l);
  ctx.fillStyle=`rgba(14,17,22,${dim?0.38:0.82})`;
  ctx.fillRect(x-w/2,y-8,w,16);
  ctx.fillStyle=`rgba(245,211,107,${dim?0.18:0.92})`;
  ctx.fillText(text,x-(l.fact_count>1?13:0),y);
  if(l.fact_count>1){
    const bx=x-w/2+labelW+13;
    ctx.fillStyle=`rgba(240,106,166,${dim?0.22:0.96})`;
    ctx.fillRect(bx-11,y-7,22,14);
    ctx.fillStyle="rgba(14,17,22,.95)";
    ctx.font="700 9px -apple-system,Segoe UI";
    ctx.fillText(`×${l.fact_count}`,bx,y);
  }
}
function relationLabelRect(l){
  const w=relationLabelWidth(l);
  return {left:l.x-w/2,right:l.x+w/2,top:l.y-8,bottom:l.y+8};
}
function relationLabelsOverlap(a,b,pad=6){
  return a.left<b.right+pad&&a.right+pad>b.left&&a.top<b.bottom+pad&&a.bottom+pad>b.top;
}
function layoutRelationLabels(labels){
  const ordered=labels.slice().sort((a,b)=>a.x-b.x||a.y-b.y);
  ordered.forEach(l=>{l.rect=relationLabelRect(l);});
  for(let pass=0;pass<8;pass++){
    let moved=false;
    for(let i=1;i<ordered.length;i++){
      const cur=ordered[i];
      for(let j=0;j<i;j++){
        const prev=ordered[j];
        if(!relationLabelsOverlap(cur.rect,prev.rect))continue;
        const down=cur.y>=prev.y;
        const push=down?prev.rect.bottom-cur.rect.top+7:cur.rect.bottom-prev.rect.top+7;
        cur.y+=down?Math.max(10,push):-Math.max(10,push);
        cur.rect=relationLabelRect(cur);
        moved=true;
      }
    }
    if(!moved)break;
  }
  return ordered;
}
function drawRelationLabels(labels){
  layoutRelationLabels(labels).forEach(l=>drawRelationLabel(l));
}

function paint(){
  ctx.clearRect(0,0,W,H);
  const foc=hover||selected||hoverEdge||selectedEdge;
  const relationLabels=[];
  // edges
  ctx.lineCap="round";
  for(const l of links){
    const s=l.source,t=l.target; if(s.x==null||t.x==null)continue;
    const [x1,y1]=T(s.x,s.y),[x2,y2]=T(t.x,t.y);
    const lit=(hover||selected)&&(s===hover||t===hover||s===selected||t===selected)||l===hoverEdge||l===selectedEdge;
    const dim=foc&&!lit;
    const col=l.entity_relation?"231,183,95":(l.owner?"255,255,255":hexToRgb(catColor(s.owner?t.cat:s.cat)));
    ctx.strokeStyle=`rgba(${col},${lit?0.9:(dim?0.04:(l.entity_relation?0.58:0.16))})`;
    ctx.lineWidth=(lit?1.8:(l.entity_relation?1.35:(l.aggregated?1.0:0.6)))*Math.min(1.5,view.k);
    ctx.setLineDash(l.entity_relation?[2,3]:(l.cross?[5,4]:[]));
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    if(l.entity_relation){
      ctx.setLineDash([]);
      const label=(l.relation||"relation").replace(/_/g," "),p=relationLabelPoint(x1,y1,x2,y2,l);
      relationLabels.push({text:label,x:p.x,y:p.y,dim,fact_count:l.fact_count||0});
    }
  }
  ctx.setLineDash([]);
  // nodes
  for(const n of nodes){
    if(n.x==null)continue;
    const [x,y]=T(n.x,n.y),r=n.r*Math.min(1.7,Math.max(.7,view.k));
    const edgeFocus=hoverEdge||selectedEdge;
    const focused=foc&&(nb(n)||nbSel(n)||(edgeFocus&&(edgeFocus.source===n||edgeFocus.target===n)));
    const dim=foc&&!focused&&n!==foc;
    ctx.globalAlpha=dim?0.22:1;
    if(n.owner){
      ctx.shadowColor="rgba(255,255,255,.55)";ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=entityFill(n);ctx.fill();ctx.shadowBlur=0;
      if(n.entity_id){
        ctx.lineWidth=2.5;ctx.strokeStyle="#f5d36b";ctx.stroke();
        ctx.beginPath();ctx.moveTo(x,y-r-7);ctx.lineTo(x+r+7,y);ctx.lineTo(x,y+r+7);ctx.lineTo(x-r-7,y);ctx.closePath();ctx.stroke();
      }
      drawInfoSatellites(x,y,r,n,dim);
      ctx.fillStyle="#0e1116";ctx.font="600 11px -apple-system,Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("Elena",x,y);
    } else {
      ctx.shadowColor=n.color;ctx.shadowBlur=(focused||n===foc)?16:7;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=entityFill(n);ctx.fill();ctx.shadowBlur=0;
      if(n.entity_id){
        ctx.lineWidth=2.4;ctx.strokeStyle="#f5d36b";ctx.stroke();
        ctx.beginPath();ctx.moveTo(x,y-r-6);ctx.lineTo(x+r+6,y);ctx.lineTo(x,y+r+6);ctx.lineTo(x-r-6,y);ctx.closePath();ctx.stroke();
        (n.collapsed_aliases||[]).slice(0,4).forEach((_,i)=>{
          const aliases=n.collapsed_aliases||[], a=-Math.PI/2+i*2*Math.PI/Math.max(4,aliases.length);
          ctx.beginPath();ctx.arc(x+Math.cos(a)*(r+10),y+Math.sin(a)*(r+10),2.2,0,7);ctx.fillStyle="#f5d36b";ctx.fill();
        });
        drawInfoSatellites(x,y,r,n,dim);
      }
      if(n.anchor&&expanded.has(n.id)){ctx.lineWidth=2.5;ctx.strokeStyle="#fff";ctx.stroke();}
      else if(n===selected){ctx.lineWidth=2.5;ctx.strokeStyle="#fff";ctx.stroke();}
      else if(n.negative){ctx.lineWidth=1.6;ctx.strokeStyle="var(--danger)";ctx.strokeStyle="#f0708a";ctx.stroke();}
    }
    ctx.globalAlpha=1;
  }
  // labels (strong nodes, or focused neighbourhood)
  ctx.textAlign="left";ctx.textBaseline="middle";
  for(const n of nodes){
    if(n.owner)continue;
  const show=n.entity_id||n===hover||n===selected||nb(n)||nbSel(n)||n.parent||n.size>=4||view.k>=2.2;
    if(!show)continue;
    const [x,y]=T(n.x,n.y),r=n.r*Math.min(1.7,Math.max(.7,view.k));
    ctx.fillStyle="rgba(231,233,238,.92)";ctx.font="11px -apple-system,Segoe UI";
    const lab=(n.negative?"!":"")+(n.entity_display_name||n.label);
    const pad=n.entity_id?18:5;
    ctx.fillText(lab.length>26?lab.slice(0,24)+"…":lab, x+r+pad, y);
  }
  ctx.font="10px -apple-system,Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";
  drawRelationLabels(relationLabels);
}
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)].join(',');}

// ---- interaction ----
function nodeAt(mx,my){let best=null,bd=1e9;for(const n of nodes){if(n.x==null)continue;const [x,y]=T(n.x,n.y),d=Math.hypot(x-mx,y-my),rr=Math.max(8,n.r*view.k+5);
  const lab=((n.negative?"!":"")+(n.entity_display_name||n.label||"")).slice(0,26), lx=x+rr+4, ly=y-9, lw=Math.max(38,lab.length*7);
  const inLabel=mx>=lx&&mx<=lx+lw&&my>=ly&&my<=ly+18;
  if((d<rr||inLabel)&&d<bd){bd=d;best=n;}}return best;}
function edgeDistance(mx,my,l){
  const s=l.source,t=l.target;if(!s||!t||s.x==null||t.x==null)return 1e9;
  const [x1,y1]=T(s.x,s.y),[x2,y2]=T(t.x,t.y),dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy||1;
  const q=Math.max(0,Math.min(1,((mx-x1)*dx+(my-y1)*dy)/len2));
  return Math.hypot(mx-(x1+q*dx),my-(y1+q*dy));
}
function edgeAt(mx,my){let best=null,bd=9;for(const l of links){if(!l.entity_relation)continue;const d=edgeDistance(mx,my,l);if(d<bd){bd=d;best=l;}}return best;}
cv.addEventListener("mousemove",e=>{
  const mx=e.offsetX,my=e.offsetY,n=nodeAt(mx,my),edge=n?null:edgeAt(mx,my),tip=$("tip");
  hover=n;hoverEdge=edge;cv.style.cursor=(n||edge)?"pointer":"grab";
  if(n&&(!n.owner||n.entity_id)){tip.style.display="block";tip.innerHTML=`<div class="t">${(n.negative?'dislikes: ':'')+(n.entity_display_name||n.label)}</div><div class="m">${n.entity_id?`${n.entity_kind} entity · ${(n.entity_aliases||[]).length} aliases · `:''}${(CAT[n.cat]||{}).label||n.cat} · strength ${(n.size||0)}/9${n.anchor?` · ${n.child_count||0} tucked tags`:''}</div>`;
    tip.style.left=Math.min(W-270,mx+14)+"px";tip.style.top=Math.min(H-60,my+14)+"px";}
  else if(edge){const s=edge.source,t=edge.target;tip.style.display="block";tip.innerHTML=`<div class="t">${esc(String(edge.relation||"relation").replace(/_/g," "))}</div><div class="m">${esc(s.entity_display_name||s.label)} -> ${esc(t.entity_display_name||t.label)}${edge.fact_count>1?` - ×${edge.fact_count} facts`:''}</div>`;
    tip.style.left=Math.min(W-270,mx+14)+"px";tip.style.top=Math.min(H-60,my+14)+"px";}
  else tip.style.display="none";
  paint();
});
cv.addEventListener("click",e=>{
  const n=nodeAt(e.offsetX,e.offsetY);
  if(n&&!n.owner&&hierarchyOn&&n.anchor){
    if(focusAnchor===n.id){expanded.clear();expandSeeds={};focusAnchor=null;}
    else{expanded.clear();expandSeeds={};expanded.add(n.id);expandSeeds[n.id]={x:n.x,y:n.y};focusAnchor=n.id;}
    closeInsp();start();return;
  }
  if(n&&(!n.owner||n.entity_id))inspect(n);
  else {const edge=edgeAt(e.offsetX,e.offsetY); if(edge)inspectEdge(edge); else closeInsp();}
});

const zoom=d3.zoom().scaleExtent([0.2,6]).on("zoom",ev=>{view=ev.transform;paint();});
d3.select(cv).call(zoom);
function fit(){
  const xs=nodes.filter(n=>n.x!=null);if(!xs.length)return;
  const minx=d3.min(xs,n=>n.x),maxx=d3.max(xs,n=>n.x),miny=d3.min(xs,n=>n.y),maxy=d3.max(xs,n=>n.y);
  const w=maxx-minx||1,h=maxy-miny||1,k=Math.min(W/(w+120),H/(h+120),2);
  const tx=W/2-k*(minx+maxx)/2,ty=H/2-k*(miny+maxy)/2;
  d3.select(cv).transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k));
}
$("fit").onclick=fit;
$("hier").onclick=()=>{hierarchyOn=!hierarchyOn;$("hier").classList.toggle("on",hierarchyOn);expanded.clear();expandSeeds={};focusAnchor=null;start();setTimeout(fit,700);};
$("known").onclick=()=>{knownOnly=!knownOnly;$("known").classList.toggle("on",knownOnly);start();if(!focusAnchor)setTimeout(fit,700);};
$("ix").onclick=closeInsp;
addEventListener("keydown",e=>{if(e.key==="Escape"){expanded.clear();expandSeeds={};focusAnchor=null;closeInsp();start();}});
function closeInsp(){selected=null;selectedEdge=null;$("insp").classList.remove("open");paint();}

function strengthWord(s){return s>=7?"very strong":s>=4?"strong":s>=2?"moderate":"weak/tentative";}
function entityDetails(n){
  if(!n.entity_id)return "";
  const fields=(n.entity_fields||[]).map(f=>`<div>${esc(f.field)}: <b>${esc(f.value)}</b> <span class="hint">${esc(f.provenance||"")}</span></div>`).join("")||'<span class="hint">none</span>';
  const rels=(n.entity_relations||[]).map(r=>`<a>${esc(String(r.relation||"").replace(/_/g," "))} ${esc(r.other_name)}${r.fact_count>1?` <b style="color:${ENTITY_KIND_COLORS.info}">×${r.fact_count}</b>`:""}<span class="w">${r.weight}/9</span></a>`).join("")||'<span class="hint">none</span>';
  const aliases=(n.entity_aliases||[]).map(esc).join(", ");
  return `<div class="kv"><div class="k">Entity</div><div class="box"><b>${esc(n.entity_kind)}</b> · ${esc(n.entity_display_name||n.label)}<br/><span class="hint">${aliases}</span></div></div>`+
    `<div class="kv"><div class="k">Fields</div><div class="box">${fields}</div></div>`+
    `<div class="kv"><div class="k">Relations</div><div class="links">${rels}</div></div>`;
}
function inspect(n){
  selectedEdge=null;selected=n;const c=CAT[n.cat]||{label:n.cat,color:n.color};
  const conf=Math.round((n.confidence||0)*100);
  const conn=[...(adj[n.id]||[])].map(id=>byId[id]).filter(x=>x&&!x.owner).sort((a,b)=>b.size-a.size);
  const why=n.known?`Reinforced enough to be treated as <b>known</b> — FERNme can act on it. Strength ${(n.size||0)}/9 (${strengthWord(n.size)}).`
                   :`Seen, but not yet reinforced enough — FERNme would <b>ask before acting</b>. Strength ${(n.size||0)}/9 (${strengthWord(n.size)}).`;
  $("ibody").innerHTML=
    `<h2>${(n.negative?'not ':'')+n.label}${n.negative?'<span class="badge">dislike</span>':''}</h2>`+
    `<div class="chip"><span class="dot" style="background:${c.color}"></span>${c.label}</div>`+
    entityDetails(n)+
    (n.gloss?`<div class="kv"><div class="k">What it means</div><div class="v">${n.gloss}</div></div>`:'')+
    (n.context?`<div class="kv"><div class="k">Context</div><div class="box">${n.context}</div></div>`:'')+
    `<div class="kv"><div class="k">Strength</div><div class="bar"><i style="width:${(n.size/9*100)}%;background:${c.color}"></i></div><div class="v" style="margin-top:5px">${(n.size||0)} / 9</div></div>`+
    (n.anchor?`<div class="kv"><div class="k">Nested tags</div><div class="v">${n.child_count||0}</div></div>`:'')+
    `<div class="kv"><div class="k">Confidence</div><div class="v">${conf}%<span class="tag ${n.known?'known':'guess'}">${n.known?'known':'tentative'}</span></div></div>`+
    `<div class="kv"><div class="k">Why FERNme remembers this</div><div class="box">${why}</div></div>`+
    `<div class="kv"><div class="k">Connected memories (${conn.length})</div><div class="links">`+
      (conn.length?conn.slice(0,12).map(t=>`<a data-id="${t.id}">${(t.negative?'!':'')+t.label}<span class="w">${t.size}/9</span></a>`).join(''):'<span class="hint">none yet</span>')+
    `</div></div>`+
    `<div class="note">Read-only preview.</div>`;
  $("ibody").querySelectorAll("a[data-id]").forEach(a=>a.onclick=()=>{const t=byId[a.dataset.id];if(t)inspect(t);});
  $("insp").classList.add("open");paint();
}
function inspectEdge(l){
  selected=null;selectedEdge=l;
  const s=l.source,t=l.target,rel=String(l.relation||"relation").replace(/_/g," ");
  const facts=(l.facts||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0)||String(b.fact_id||"").localeCompare(String(a.fact_id||"")));
  $("ibody").innerHTML=
    `<h2>${esc(rel)}${l.fact_count>1?`<span class="badge">×${l.fact_count}</span>`:""}</h2>`+
    `<div class="chip"><span class="dot" style="background:#f5d36b"></span>typed relation</div>`+
    `<div class="kv"><div class="k">From</div><div class="box">${esc(s.entity_display_name||s.label||s.id)}</div></div>`+
    `<div class="kv"><div class="k">To</div><div class="box">${esc(t.entity_display_name||t.label||t.id)}</div></div>`+
    `<div class="kv"><div class="k">Strength</div><div class="box">${esc(l.weight||0)} / 9 - ${esc(l.hits||0)} hits - ${esc(l.provenance||"stated")}</div></div>`+
    `<div class="kv"><div class="k">Facts (${facts.length})</div><div class="links">`+
      (facts.length?facts.map(f=>`<a>${esc(f.note)}<span class="w">${esc(f.provenance||"")} ${esc(f.ts||"")}</span></a>`).join(""):'<span class="hint">none</span>')+
    `</div></div>`+
    `<div class="note">Relation facts are stored as inert display data.</div>`;
  $("insp").classList.add("open");paint();
}
function legend(){
  const kinds=[
    ["owner",ENTITY_KIND_COLORS.owner],
    ["person",ENTITY_KIND_COLORS.person],
    ["org",ENTITY_KIND_COLORS.org],
    ["project",ENTITY_KIND_COLORS.project],
    ["info",ENTITY_KIND_COLORS.info],
  ];
  $("legend").innerHTML="<b style='color:var(--tx);font-size:11px;text-transform:uppercase;letter-spacing:.05em'>categories</b><br/>"+
    DATA.cats.map(c=>`<span class="sw" style="background:${c.color}"></span>${c.label}`).join("<br/>")+
    "<br/><b style='color:var(--tx);font-size:11px;text-transform:uppercase;letter-spacing:.05em'>entity kinds</b><br/>"+
    kinds.map(k=>`<span class="sw" style="background:${k[1]}"></span>${k[0]}`).join("<br/>");
}
addEventListener("resize",()=>{resize();layoutAnchors();sim&&sim.alpha(.3).restart();paint();});
resize();legend();start();setTimeout(fit,800);
</script></body></html>
