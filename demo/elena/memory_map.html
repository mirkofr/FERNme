    t.innerHTML=`<div class="t">${(n.negative?'dislikes: ':'')+n.label}</div><div class="m">${CAT[n.cat].label} · strength ${(n.size||0).toFixed(1)}/9 · click to inspect</div>`;
    t.style.display="block";t.style.left=Math.min(W-255,mx+14)+"px";t.style.top=Math.min(H-70,my+14)+"px";}
  else{hover=null;const c=bubbleAt(mx,my);hoverCat=c?c.key:null;cv.style.cursor=c?"grab":"default";t.style.display="none";}});
cv.addEventListener("mouseup",e=>{if(drag&&drag.type==="node"&&!moved){inspect(drag.node);}
  else if(drag&&drag.type==="pan"&&!moved){closeInspect();}drag=null;});
cv.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY<0?1.13:0.885,mx=e.offsetX,my=e.offsetY,[wx,wy]=inv(mx,my);
  view.k=Math.max(0.4,Math.min(7,view.k*f));view.x=mx-wx*view.k;view.y=my-wy*view.k;},{passive:false});
$("fit").onclick=()=>{reset();for(const c of cats){c.cx=c.hx;c.cy=c.hy;c.vx=c.vy=0;}};
resize();layout();reset();if(!raf)tick();
</script></body></html>
