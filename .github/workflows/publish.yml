name: Publish to PyPI

# Publishes to PyPI automatically whenever you push a version tag (e.g. v0.3.1).
# Uses PyPI "trusted publishing" (OIDC) — no API token or password stored anywhere.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # don't fail if this version is already on PyPI
