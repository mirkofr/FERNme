name: Temporary FERNme benchmark
on:
  push:
    branches:
      - bench/fernme-20260922

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "datasets>=3.0"
      - name: Run 20-seed FERNme benchmark
        run: |
          mkdir -p reports
          python -m fernme.eval.harness --seeds 20 --json reports/eval_harness_20.json
      - name: Inspect PersonaMem-v3 released dataset
        run: |
          python - <<'PY'
          from datasets import get_dataset_config_names, load_dataset
          repo = "bowen-upenn/PersonaMem-v3"
          print("PERSONAMEM_INSPECT_BEGIN")
          configs = get_dataset_config_names(repo)
          print("CONFIGS", configs)
          for cfg in configs:
              print("CONFIG", cfg)
              ds = load_dataset(repo, cfg, split="full", streaming=True)
              print("FEATURES", ds.features)
              for i, row in enumerate(ds.take(1)):
                  print("SAMPLE", i, {k: (str(v)[:800] if v is not None else None) for k, v in row.items()})
          print("PERSONAMEM_INSPECT_END")
          PY
      - name: Print machine-readable FERNme summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/eval_harness_20.json")
          r = json.loads(p.read_text())
          print("BENCHMARK_JSON_BEGIN")
          print(json.dumps({
              "mode": r["mode"],
              "seeds": r["seeds"],
              "k": r["k"],
              "methods": r["methods"],
              "regimes": r["regimes"],
              "summary": r["summary"],
          }, sort_keys=True))
          print("BENCHMARK_JSON_END")
          PY
