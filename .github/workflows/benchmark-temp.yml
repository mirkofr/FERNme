name: Temporary FERNme benchmark
on:
  push:
    branches:
      - bench/fernme-20260922

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fast-lane ablation
        run: |
          python - <<'PY'
          from dataclasses import replace
          from fernme.config import DEFAULT
          from fernme.eval.harness import run

          variants = []
          for beta_fast in (0.5, 1.0, 2.0, 4.0):
              for bl_decay in (0.5, 0.75, 1.0):
                  variants.append((beta_fast, bl_decay))

          print("ABLATION_BEGIN")
          for beta_fast, bl_decay in variants:
              cfg = replace(DEFAULT, beta_fast=beta_fast, bl_decay=bl_decay)
              report = run(seeds=20, cfg=cfg, k=5)
              s = report["summary"]
              def m(regime, metric="precision_at_k"):
                  return s[regime]["fern_pure"][metric]["mean"]
              vals = {
                  "beta_fast": beta_fast,
                  "bl_decay": bl_decay,
                  "static_p": m("static"),
                  "abrupt_p": m("abrupt_drift"),
                  "abrupt_stale": m("abrupt_drift", "stale_recall_rate"),
                  "gradual_p": m("gradual_drift"),
                  "gradual_stale": m("gradual_drift", "stale_recall_rate"),
                  "staleness_p": m("staleness"),
                  "context_p": m("contextual"),
                  "outcome": m("outcome", "action_quality"),
                  "tokens_context": s["contextual"]["fern_pure"]["token_estimate"]["mean"],
              }
              print(vals)
          print("ABLATION_END")
          PY
