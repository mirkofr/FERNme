name: Temporary FERNme benchmark
on:
  push:
    branches:
      - bench/fernme-20260922

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Association-spread ablation
        run: |
          python - <<'PY'
          import math
          from dataclasses import replace
          from fernme.config import DEFAULT
          from fernme.eval.harness import run
          import fernme.retrieve.activation as activation
          import fernme.retrieve.card as card
          import fernme.retrieve.entity_card as entity_card

          original_spread = activation.spread

          def make_spread(mode):
              def spread(ug, assoc, seeds, now, cfg=DEFAULT):
                  act = {}
                  for attr in ug.edges:
                      act[attr] = activation.base_level(ug, attr, now, cfg)
                  for s in seeds:
                      act[s] = act.get(s, 0.0) + 1.0

                  if mode == "seed_only":
                      frontier = list(dict.fromkeys(seeds))
                  elif mode == "seed_recent3":
                      recent = [a for a,e in sorted(
                          ug.edges.items(), key=lambda kv:(-kv[1].fast, -kv[1].last_reinforced, kv[0])
                      )[:3]]
                      frontier = list(dict.fromkeys(list(seeds) + recent))
                  else:
                      frontier = list(act.keys())

                  for _ in range(cfg.hops):
                      delta = {}
                      for j in frontier:
                          nbrs = assoc.neighbors(j)
                          tot = sum(w for _, w in nbrs)
                          if tot <= 0:
                              continue
                          aj = act.get(j, 0.0)
                          for nb, w in nbrs:
                              delta[nb] = delta.get(nb, 0.0) + aj * (w / tot)
                      for k,v in delta.items():
                          act[k] = act.get(k, 0.0) + 0.5*v
                      frontier = list(delta.keys())

                  clusters = {}
                  for attr in act:
                      if ":" in attr:
                          clusters.setdefault(attr.split(":",1)[0], []).append(attr)
                  for members in clusters.values():
                      if len(members) < 2: continue
                      winner=max(members,key=lambda a:act[a])
                      for a in members:
                          if a != winner:
                              act[a] *= 0.3
                  return act
              return spread

          cfg = replace(DEFAULT, beta_fast=2.0, bl_decay=0.75)
          print("SPREAD_ABLATION_BEGIN")
          for mode in ("current", "seed_only", "seed_recent3"):
              sp = original_spread if mode == "current" else make_spread(mode)
              activation.spread = sp
              card.spread = sp
              if hasattr(entity_card, "spread"):
                  entity_card.spread = sp
              report = run(seeds=20, cfg=cfg, k=5)
              s=report["summary"]
              def m(regime, metric="precision_at_k"):
                  return s[regime]["fern_pure"][metric]["mean"]
              print({
                  "mode":mode,
                  "static":m("static"),
                  "abrupt":m("abrupt_drift"),
                  "abrupt_stale":m("abrupt_drift","stale_recall_rate"),
                  "gradual":m("gradual_drift"),
                  "gradual_stale":m("gradual_drift","stale_recall_rate"),
                  "staleness":m("staleness"),
                  "context":m("contextual"),
                  "outcome":m("outcome","action_quality"),
                  "tokens_context":s["contextual"]["fern_pure"]["token_estimate"]["mean"],
              })
          print("SPREAD_ABLATION_END")
          PY
