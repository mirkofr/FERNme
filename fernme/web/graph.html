<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FERNme memory map</title>
<style>
:root{--bg:#0e1116;--surf:#161b22;--bd:rgba(255,255,255,.11);--tx:#e7e9ee;--mut:#8b93a1;--owner:#f5f7fa;--danger:#f0708a}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html,body{margin:0;height:100%;background:#0e1116;color:var(--tx);overflow:hidden}
body{display:flex;flex-direction:column}
header{padding:10px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:.5px solid var(--bd);background:rgba(16,19,24,.96);z-index:4}
h1{font-size:15px;margin:0 8px 0 0}h1 span{font-size:12px;color:var(--mut);font-weight:400;margin-left:7px}
input,button{font-size:12px;padding:6px 9px;border:.5px solid var(--bd);border-radius:8px;background:var(--surf);color:var(--tx)}
button{cursor:pointer;font-weight:600}button:hover,button.on{background:#23425c;border-color:#3a6a93;color:#cfe6ff}
.grow{flex:1}.hint{font-size:12px;color:var(--mut)}
#stage{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab}
.panel{position:absolute;background:rgba(22,27,34,.94);border:.5px solid var(--bd);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#tip{display:none;pointer-events:none;z-index:6;padding:8px 11px;font-size:12px;max-width:290px;line-height:1.5}
#tip .t{font-weight:700;word-break:break-word}#tip .m{color:var(--mut);margin-top:2px}
#legend{left:14px;bottom:14px;padding:11px 13px;font-size:12px;color:var(--mut);line-height:1.8;z-index:5}
#legend .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:7px}
#stats{right:14px;top:14px;padding:10px 12px;font-size:12px;color:var(--mut);line-height:1.7;text-align:right}
#stats b{color:var(--tx);font-size:15px}
#insp{position:absolute;top:0;right:0;height:100%;width:330px;transform:translateX(106%);transition:transform .22s ease;padding:18px;overflow:auto;z-index:8;border-left:.5px solid var(--bd);background:rgba(16,19,24,.97)}
#insp.open{transform:none}
#insp .x{position:absolute;top:10px;right:14px;cursor:pointer;color:var(--mut);font-size:22px}
#insp h2{font-size:18px;margin:4px 34px 10px 0;word-break:break-word}
.kv{margin:12px 0}.kv .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.box{font-size:13px;line-height:1.5;background:#0e1116;border:.5px solid var(--bd);border-radius:8px;padding:10px}.links a{display:block;font-size:13px;color:var(--tx);padding:6px 8px;border:.5px solid var(--bd);border-radius:8px;margin-bottom:6px;text-decoration:none}.links a .w{float:right;color:var(--mut);font-size:11px}
</style></head><body>
<header>
  <h1>FERNme<span>memory map</span></h1>
  <input id="site" placeholder="site" value="demo.com"/>
  <input id="user" placeholder="user (optional)" value="ana"/>
  <input id="base" placeholder="http://localhost:8077"/>
  <button id="load">Load</button>
  <button id="fit">Fit</button>
  <button id="hier" class="on">Hierarchy</button>
  <button id="known" class="on">Known only</button>
  <span class="grow"></span>
  <span class="hint" id="msg">click anchors to expand/collapse, toggle hierarchy for flat view</span>
</header>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="tip" class="panel"></div>
  <div id="stats" class="panel"></div>
  <div id="legend" class="panel"></div>
  <div id="insp" class="panel"><span class="x" id="ix">&times;</span><div id="ibody"></div></div>
</div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const SAMPLE={
  cats:[
    {key:"people",label:"People",color:"#185fa5"},
    {key:"facts",label:"Facts & identity",color:"#0f6e56"},
    {key:"knowledge",label:"Knowledge & ideas",color:"#2a8c9e"}
  ],
  nodes:[
    {id:"person:avery-quinn",label:"avery quinn",kind:"person",cat:"people",category:"people",size:5,known:true,color:"#185fa5"},
    {id:"company:atlas-partners",label:"atlas partners",kind:"company",cat:"facts",category:"facts",size:6,known:true,color:"#0f6e56"},
    {id:"role:associate",label:"associate",kind:"role",cat:"facts",category:"facts",size:2,known:true,color:"#0f6e56"},
    {id:"topic:startup-support",label:"startup support",kind:"topic",cat:"knowledge",category:"knowledge",size:3,known:true,color:"#2a8c9e"}
  ],
  edges:[
    {source:"person:avery-quinn",target:"company:atlas-partners",weight:4,assoc:true},
    {source:"person:avery-quinn",target:"role:associate",weight:3,assoc:true},
    {source:"company:atlas-partners",target:"topic:startup-support",weight:2,assoc:true}
  ],
  hierarchy:{
    anchors:[
      {id:"person:avery-quinn",label:"avery quinn",kind:"person",cat:"people",category:"people",size:6,known:true,color:"#185fa5",child_count:1},
      {id:"company:atlas-partners",label:"atlas partners",kind:"company",cat:"facts",category:"facts",size:6,known:true,color:"#0f6e56",child_count:1}
    ],
    subnodes:[
      {id:"role:associate",label:"associate",kind:"role",cat:"facts",category:"facts",size:2,known:true,color:"#0f6e56",parent:"person:avery-quinn"},
      {id:"topic:startup-support",label:"startup support",kind:"topic",cat:"knowledge",category:"knowledge",size:3,known:true,color:"#2a8c9e",parent:"company:atlas-partners"}
    ],
    edges:[{source:"person:avery-quinn",target:"company:atlas-partners",weight:6,aggregated:true}],
    expanded_edges:[
      {source:"person:avery-quinn",target:"role:associate",parentSource:"person:avery-quinn",parentTarget:"person:avery-quinn",weight:3},
      {source:"company:atlas-partners",target:"topic:startup-support",parentSource:"company:atlas-partners",parentTarget:"company:atlas-partners",weight:2}
    ]
  },
  stats:{attributes:4,edges:3}
};
let DATA=SAMPLE, nodes=[], links=[], byId={}, adj={}, W=0, H=0, view=d3.zoomIdentity;
let hover=null, selected=null, hierarchyOn=true, knownOnly=true, expanded=new Set(), focusAnchor=null, sim=null, zoom=null;
const cv=document.getElementById("c"), ctx=cv.getContext("2d"), DPR=Math.max(1,devicePixelRatio||1), $=id=>document.getElementById(id);
function relKey(e){return `${e.source}|${e.relation||e.label||""}|${e.target}`;}
function withEntityRelations(sourceEdges){
  const rels=DATA.entity_relations||[];
  if(!rels.length)return sourceEdges;
  const seen=new Set(sourceEdges.filter(e=>e.entity_relation).map(relKey));
  const add=[];
  rels.forEach(r=>{
    const e={...r,entity_relation:true,relation:r.relation||r.label,label:r.label||r.relation};
    if(!seen.has(relKey(e))){seen.add(relKey(e));add.push(e);}
  });
  return [...sourceEdges,...add];
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function norm(data){
  const cats=data.cats||data.categories||[];
  const cmap={}; cats.forEach(c=>cmap[c.key]=c);
  (data.nodes||[]).forEach(n=>{n.cat=n.cat||n.category||"facts"; n.color=n.color||(cmap[n.cat]&&cmap[n.cat].color)||"#8b93a1";});
  if(data.hierarchy){
    [...(data.hierarchy.anchors||[]),...(data.hierarchy.subnodes||[])].forEach(n=>{n.cat=n.cat||n.category||"facts"; n.color=n.color||(cmap[n.cat]&&cmap[n.cat].color)||"#8b93a1";});
  }
  data.cats=cats.length?cats:[{key:"facts",label:"Facts & identity",color:"#0f6e56"}];
  return data;
}
function catColor(k){const c=(DATA.cats||[]).find(x=>x.key===k);return c?c.color:"#8b93a1";}
function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
function visibleGraph(){
  if(hierarchyOn&&DATA.hierarchy){
    const anchors=(DATA.hierarchy.anchors||[]).map(n=>({...n,anchor:true,known:n.known!==false}));
    const visibleAnchors=new Set(anchors.map(n=>n.id));
    const visible=new Set(visibleAnchors);
    const subs=(DATA.hierarchy.subnodes||[]).filter(n=>expanded.has(n.parent)).map(n=>({...n,anchor:false}));
    subs.forEach(n=>visible.add(n.id));
    return {
      nodes:[...anchors.filter(n=>visibleAnchors.has(n.id)),...subs],
      edges:withEntityRelations([...(DATA.hierarchy.edges||[]),...(DATA.hierarchy.expanded_edges||[]).filter(e=>visible.has(e.source)&&visible.has(e.target))])
    };
  }
  return {nodes:DATA.nodes||[], edges:withEntityRelations(DATA.edges||[])};
}
function build(){
  const vg=visibleGraph();
  const ns=vg.nodes.filter(n=>!knownOnly||n.known||n.anchor||expanded.has(n.parent));
  const keep=new Set(ns.map(n=>n.id));
  nodes=ns.map(n=>({...n,r:(n.anchor?8:5)+Math.sqrt(n.size||1)*(n.anchor?2.6:2.1),x:W/2+(Math.random()-.5)*380,y:H/2+(Math.random()-.5)*300}));
  byId={}; nodes.forEach(n=>byId[n.id]=n);
  links=vg.edges.filter(e=>keep.has(e.source)&&keep.has(e.target)).map(e=>({source:e.source,target:e.target,weight:e.weight,aggregated:e.aggregated,cross:e.cross,entity_relation:e.entity_relation,relation:e.relation||e.label}));
  adj={}; links.forEach(l=>{(adj[l.source]=adj[l.source]||new Set()).add(l.target);(adj[l.target]=adj[l.target]||new Set()).add(l.source)});
  start();
  $("stats").innerHTML=`<b>${nodes.length}</b> visible nodes<br/><b>${links.length}</b> visible links`;
}
function start(){
  if(sim)sim.stop();
  sim=d3.forceSimulation(nodes)
    .force("charge",d3.forceManyBody().strength(d=>d.anchor?-95:-55))
    .force("link",d3.forceLink(links).id(d=>d.id).distance(d=>d.aggregated?120:58).strength(.22))
    .force("collide",d3.forceCollide().radius(d=>d.r+4).strength(.9))
    .force("x",d3.forceX(W/2).strength(.04))
    .force("y",d3.forceY(H/2).strength(.04))
    .on("tick",paint);
}
function T(x,y){return [x*view.k+view.x,y*view.k+view.y]}
function related(n){return hover&&(n===hover||(adj[hover.id]&&adj[hover.id].has(n.id)))}
function paint(){
  ctx.clearRect(0,0,W,H);
  for(const l of links){
    const s=typeof l.source==="string"?byId[l.source]:l.source, t=typeof l.target==="string"?byId[l.target]:l.target;
    if(!s||!t)continue;
    const [x1,y1]=T(s.x,s.y),[x2,y2]=T(t.x,t.y), lit=hover&&(s===hover||t===hover), dim=hover&&!lit;
    ctx.strokeStyle=l.entity_relation?`rgba(245,211,107,${lit?0.9:(dim?0.06:0.62)})`:(l.cross?`rgba(231,233,238,${dim?0.05:0.35})`:`rgba(139,147,161,${lit?0.8:(dim?0.05:0.28)})`);
    ctx.lineWidth=(lit?1.8:(l.entity_relation?1.35:(l.aggregated?1.2:.8)))*Math.min(1.5,view.k);
    ctx.setLineDash(l.entity_relation?[2,3]:(l.cross?[5,4]:[]));
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    if(l.entity_relation&&(lit||view.k>=0.7)){
      ctx.setLineDash([]);
      ctx.fillStyle=`rgba(245,211,107,${dim?0.12:0.9})`;
      ctx.font="10px -apple-system,Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText((l.relation||"relation").replace(/_/g," "),(x1+x2)/2,(y1+y2)/2-7);
    }
  }
  ctx.setLineDash([]);
  for(const n of nodes){
    const [x,y]=T(n.x,n.y),r=n.r*Math.min(1.7,Math.max(.75,view.k)), dim=hover&&!related(n);
    ctx.globalAlpha=dim?0.25:1;
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=n.color||catColor(n.cat);ctx.fill();
    if(n.entity_id){
      ctx.lineWidth=2.3;ctx.strokeStyle="#f5d36b";ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y-r-6);ctx.lineTo(x+r+6,y);ctx.lineTo(x,y+r+6);ctx.lineTo(x-r-6,y);ctx.closePath();ctx.stroke();
      (n.collapsed_aliases||[]).slice(0,4).forEach((_,i)=>{
        const aliases=n.collapsed_aliases||[], a=-Math.PI/2+i*2*Math.PI/Math.max(4,aliases.length);
        ctx.beginPath();ctx.arc(x+Math.cos(a)*(r+10),y+Math.sin(a)*(r+10),2.2,0,7);ctx.fillStyle="#f5d36b";ctx.fill();
      });
    }
    if(n.anchor&&expanded.has(n.id)){ctx.lineWidth=2.4;ctx.strokeStyle="#fff";ctx.stroke()}
    if(n.negative){ctx.lineWidth=1.8;ctx.strokeStyle="var(--danger)";ctx.stroke()}
    ctx.globalAlpha=1;
    if(n.anchor||n.parent||n.size>=4||n===hover){
      ctx.fillStyle="rgba(231,233,238,.94)";ctx.font="11px -apple-system,Segoe UI";ctx.textBaseline="middle";
      const lab=(n.negative?"!":"")+(n.entity_display_name||n.label||n.id);
      ctx.fillText(lab.length>28?lab.slice(0,26)+"...":lab,x+r+5,y);
    }
  }
}
function nodeAt(mx,my){let best=null,bd=1e9;for(const n of nodes){const [x,y]=T(n.x,n.y),d=Math.hypot(x-mx,y-my),rr=Math.max(9,n.r*view.k+5);if(d<rr&&d<bd){best=n;bd=d}}return best}
cv.addEventListener("mousemove",e=>{
  hover=nodeAt(e.offsetX,e.offsetY);cv.style.cursor=hover?"pointer":"grab";
  const tip=$("tip");
  if(hover){
    tip.style.display="block";
    tip.innerHTML=`<div class="t">${hover.entity_display_name||hover.label||hover.id}</div><div class="m">${hover.entity_id?`${hover.entity_kind} entity - ${(hover.entity_aliases||[]).length} aliases - `:''}${hover.kind||hover.cat} - strength ${hover.size||1}${hover.anchor?` - ${hover.child_count||0} tucked tags`:''}</div>`;
    tip.style.left=Math.min(W-305,e.offsetX+14)+"px";tip.style.top=Math.min(H-70,e.offsetY+14)+"px";
  }else tip.style.display="none";
  paint();
});
cv.addEventListener("click",e=>{
  const n=nodeAt(e.offsetX,e.offsetY);
  if(n&&hierarchyOn&&n.anchor){
    if(expanded.has(n.id)){expanded.delete(n.id);focusAnchor=null}else{expanded.add(n.id);focusAnchor=n.id}
    build();
  }else if(n){
    inspect(n);
  }else{
    closeInsp();
  }
});
zoom=d3.zoom().scaleExtent([.25,5]).on("zoom",ev=>{view=ev.transform;paint()});
d3.select(cv).call(zoom);
function fit(){
  if(!nodes.length)return;
  const minx=d3.min(nodes,n=>n.x),maxx=d3.max(nodes,n=>n.x),miny=d3.min(nodes,n=>n.y),maxy=d3.max(nodes,n=>n.y);
  const k=Math.min(W/((maxx-minx||1)+140),H/((maxy-miny||1)+140),2);
  const tx=W/2-k*(minx+maxx)/2,ty=H/2-k*(miny+maxy)/2;
  d3.select(cv).transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k));
}
function legend(){ $("legend").innerHTML="<b style='color:var(--tx)'>categories</b><br/>"+DATA.cats.map(c=>`<span class="sw" style="background:${c.color}"></span>${c.label}`).join("<br/>");}
async function load(){
  const base=($("base").value||location.origin||"").replace(/\/+$/,"");
  const site=$("site").value.trim(), user=$("user").value.trim();
  if(!site){$("msg").textContent="enter a site";return}
  $("msg").textContent="loading...";
  try{
    const r=await fetch(base+"/graph-data",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({site,user:user||null,hierarchy:true})});
    const d=await r.json(); if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));
    DATA=norm(d); expanded.clear(); legend(); build(); setTimeout(fit,650);
    $("msg").textContent=`${d.stats.attributes} memories, ${d.stats.edges} links`;
  }catch(e){DATA=norm(SAMPLE); expanded.clear(); legend(); build(); $("msg").textContent="could not load: "+e.message+"; showing sample";}
}
$("load").onclick=load;$("fit").onclick=fit;
$("hier").onclick=()=>{hierarchyOn=!hierarchyOn;$("hier").classList.toggle("on",hierarchyOn);expanded.clear();build();setTimeout(fit,500)};
$("known").onclick=()=>{knownOnly=!knownOnly;$("known").classList.toggle("on",knownOnly);build();setTimeout(fit,500)};
$("ix").onclick=closeInsp;
addEventListener("resize",()=>{resize();sim&&sim.alpha(.25).restart();paint()});
function closeInsp(){selected=null;$("insp").classList.remove("open");paint();}
function entityDetails(n){
  if(!n.entity_id)return "";
  const fields=(n.entity_fields||[]).map(f=>`<div>${esc(f.field)}: <b>${esc(f.value)}</b> <span class="hint">${esc(f.provenance||"")}</span></div>`).join("")||'<span class="hint">none</span>';
  const rels=(n.entity_relations||[]).map(r=>`<a>${esc(String(r.relation||"").replace(/_/g," "))} ${esc(r.other_name)}<span class="w">${r.weight}/9</span></a>`).join("")||'<span class="hint">none</span>';
  const aliases=(n.entity_aliases||[]).map(esc).join(", ");
  return `<div class="kv"><div class="k">Entity</div><div class="box"><b>${esc(n.entity_kind)}</b> - ${esc(n.entity_display_name||n.label)}<br/><span class="hint">${aliases}</span></div></div>`+
    `<div class="kv"><div class="k">Fields</div><div class="box">${fields}</div></div>`+
    `<div class="kv"><div class="k">Relations</div><div class="links">${rels}</div></div>`;
}
function inspect(n){
  selected=n;
  const conn=[...(adj[n.id]||[])].map(id=>byId[id]).filter(Boolean).sort((a,b)=>(b.size||0)-(a.size||0));
  $("ibody").innerHTML=`<h2>${esc(n.entity_display_name||n.label||n.id)}</h2>`+
    entityDetails(n)+
    `<div class="kv"><div class="k">Kind</div><div class="box">${esc(n.kind||n.cat||"memory")}</div></div>`+
    `<div class="kv"><div class="k">Strength</div><div class="box">${esc(n.size||1)} / 9</div></div>`+
    `<div class="kv"><div class="k">Connected memories (${conn.length})</div><div class="links">${conn.slice(0,12).map(t=>`<a>${esc(t.entity_display_name||t.label||t.id)}<span class="w">${esc(t.size||1)}/9</span></a>`).join("")||'<span class="hint">none</span>'}</div></div>`;
  $("insp").classList.add("open");paint();
}
resize();DATA=norm(SAMPLE);legend();build();setTimeout(fit,650);
if(location.protocol!=="file:")$("base").value=location.origin;
</script></body></html>
