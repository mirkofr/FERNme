[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fernme"
version = "0.3.3"
description = "FERNme - a user-owned memory layer for AI agents: zero-LLM deterministic core with optional human-approved enrichment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mirkomil Sharipov" }]
maintainers = [{ name = "Acquilab Inc." }]
keywords = ["llm", "agent", "memory", "hebbian", "spreading-activation", "personalization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "tiktoken>=0.5"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
mcp = ["mcp>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "httpx>=0.27"]
# Postgres-backed tests only; pgserver has no Windows wheel, so it's gated by platform
# and test_postgres.py skips automatically when these aren't installed.
pgtest = ["psycopg[binary]>=3.1", "pgserver>=0.1; sys_platform != 'win32'"]

[project.scripts]
fernme-mcp = "fernme.api.mcp_server:main"

[project.urls]
Homepage = "https://fernme.dev"
Repository = "https://github.com/mirkofr/FERNme"
Documentation = "https://fernme.dev"

[tool.setuptools.packages.find]
include = ["fernme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
